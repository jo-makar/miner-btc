[package]
name = "miner-btc"
version = "0.1.0"
authors = ["J. O. Makar <jomakar@gmail.com>"]
edition = "2021"
homepage = "https://github.com/jo-makar/miner-btc"
repository = "https://github.com/jo-makar/miner-btc"
default-run = "miner"

[dependencies]
chrono = "0.4.38"
clap = { version = "4.5.17", features = [ "cargo", "string" ] }
env_logger = "0.11.5"
lazy_static = "1.5.0"
log = "0.4.22"
num-bigint = "0.4.6"
rand = "0.8.5"
serde = { version = "1.0.216", features = [ "derive" ] }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["full"] }
